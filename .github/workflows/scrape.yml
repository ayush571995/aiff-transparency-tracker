name: Refresh AIFF data

# Re-scrapes AIFF's own site daily and commits any changes to site/data/*.json.
# A push to main from this job triggers deploy.yml, which redeploys the site.

on:
  schedule:
    - cron: "17 3 * * *"   # ~08:47 IST daily — off the top of the hour to be polite
  workflow_dispatch: {}     # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        working-directory: scraper
        run: python run_all.py

      - name: Commit updated data if changed
        run: |
          git config user.name "aiff-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/documents.json site/data/news.json site/data/governance.json site/data/manifest.json
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
